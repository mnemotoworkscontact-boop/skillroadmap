<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スキルロードマップ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: 左に経験入力、右にスキル抽出とキャリア路線。各大分類を路線カラーで色分けする。 */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F5F7F9; --fg:#14202A; --muted:#566471; --line:#D3DAE1;
  --ink:#14202A; --ink-on:#FFFFFF; --focus:#2563EB; --good:#0F766E; --gap:#B45309;
  --c0:#C2410C; --c1:#2563EB; --c2:#7C3AED; --c3:#4D7C0F; --c4:#6B645E; --c5:#DB2777; --c6:#A16207; --c7:#0F766E;
  --font-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B; --surface:#16202A; --surface-2:#1B2733; --fg:#E6ECF1; --muted:#9AA8B4; --line:#2B3946;
    --ink:#E6ECF1; --ink-on:#0E151B; --focus:#60A5FA; --good:#2DD4BF; --gap:#FBBF24;
    --c0:#FB923C; --c1:#60A5FA; --c2:#A78BFA; --c3:#84CC16; --c4:#A8A29E; --c5:#F472B6; --c6:#FBBF24; --c7:#2DD4BF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#16202A; --surface-2:#1B2733; --fg:#E6ECF1; --muted:#9AA8B4; --line:#2B3946;
  --ink:#E6ECF1; --ink-on:#0E151B; --focus:#60A5FA; --good:#2DD4BF; --gap:#FBBF24;
  --c0:#FB923C; --c1:#60A5FA; --c2:#A78BFA; --c3:#84CC16; --c4:#A8A29E; --c5:#F472B6; --c6:#FBBF24; --c7:#2DD4BF;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.7;
  padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{max-width:1120px;margin:0 auto;display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
.head{display:grid;gap:6px}
.head h1{font-family:var(--font-display);font-weight:700;font-size:clamp(24px,4vw,32px);line-height:1.3;letter-spacing:.01em}
.head p{color:var(--muted);max-width:60ch}
.badge{display:inline-block;font-family:var(--font-mono);font-size:12px;padding:1px 8px;border:1px solid var(--line);border-radius:4px;color:var(--muted);background:var(--surface)}
@media (min-width:960px){
  .app{grid-template-columns:360px minmax(0,1fr);align-items:start}
  .head{grid-column:1/-1}
  .side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:14px;min-width:0}
.panel h2{font-size:17px;font-weight:700;display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.panel h2 small{font-family:var(--font-mono);font-weight:400;font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.rows{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.row .job{flex:1 1 170px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.row select{padding:8px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.row .del{border:1px solid var(--line);background:transparent;border-radius:6px;width:34px;height:36px;cursor:pointer;color:var(--muted)}
.row .del:hover{color:var(--fg);border-color:var(--fg)}
.row .meta{flex:1 0 100%;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;min-height:18px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dc,var(--line));flex:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--ink);color:var(--ink-on);border-color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sep{border:0;border-top:1px solid var(--line);margin:0}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:700}
.field input{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);min-width:0}
.main{display:grid;gap:20px;min-width:0}
.cat{display:grid;gap:8px;padding-left:12px;border-left:4px solid var(--cc)}
.cat h3{font-size:13px;font-weight:700;color:var(--cc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sk{display:inline-flex;gap:8px;align-items:center;padding:3px 10px;border:1px solid color-mix(in srgb,var(--cc) 40%,var(--line));background:color-mix(in srgb,var(--cc) 9%,var(--surface));border-radius:6px;cursor:pointer;font-size:14px}
.sk[aria-pressed="true"]{outline:2px solid var(--cc);outline-offset:1px}
.lv{display:inline-flex;gap:2px}
.lv i{width:5px;height:12px;border-radius:1px;background:color-mix(in srgb,var(--cc) 22%,var(--surface))}
.lv i.on{background:var(--cc)}
.ev{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.ev h3{font-size:15px}
.ev p{font-size:13px;color:var(--muted)}
.ev li{font-size:13px;display:flex;flex-wrap:wrap;gap:2px 8px}
.ev li b{font-weight:700}
.ev li span{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.f{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer}
.f[aria-pressed="true"]{background:var(--ink);color:var(--ink-on);border-color:var(--ink)}
.tier{display:grid;gap:12px}
.tier>h3{font-size:15px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tier>h3 small{font-weight:400;color:var(--muted);font-size:13px}
.cards{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1240px){.cards{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.path{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:10px;min-width:0;align-content:start}
.path header{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.path h4{font-size:17px;line-height:1.4;font-weight:700}
.path .grp{font-size:12px;color:var(--muted)}
.pct{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1;color:var(--lc);white-space:nowrap}
.pct small{font-family:var(--font-body);font-size:11px;color:var(--muted);margin-left:2px}
.route{display:flex;flex-wrap:wrap;gap:4px 0;align-items:center;font-size:13px}
.st{display:inline-flex;align-items:center;gap:6px}
.st .p{width:12px;height:12px;border-radius:50%;border:3px solid var(--lc);background:var(--surface);flex:none}
.st.goal .p{background:var(--lc)}
.st+.st::before{content:"";width:22px;height:4px;background:var(--lc);margin:0 6px;flex:none}
.meter{height:6px;border-radius:3px;background:color-mix(in srgb,var(--lc) 18%,var(--surface-2));overflow:hidden}
.meter span{display:block;height:100%;background:var(--lc)}
.two{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.blk h5{margin:0 0 4px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.mini{display:flex;flex-wrap:wrap;gap:4px}
.mini span{font-size:12px;padding:1px 8px;border-radius:4px;background:color-mix(in srgb,var(--good) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 35%,var(--line))}
.gaps li{font-size:13px;display:flex;flex-wrap:wrap;gap:0 8px;padding:3px 0;border-top:1px dashed var(--line)}
.gaps li:first-child{border-top:0}
.gaps li b{color:var(--gap);font-weight:700}
.gaps li span{color:var(--muted)}
.more{font-size:12px;color:var(--muted)}
.side-note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.lateral{font-size:13px;color:var(--muted)}
.empty{padding:20px;border:1px dashed var(--line);border-radius:8px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.meter span{transition:width .3s ease}}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <h1>スキルロードマップ</h1>
    <p>これまでの経験職種から身についたスキルを割り出し、そのスキルで進めるキャリアの道を示します。<span class="badge" id="exbadge" hidden>入力例を表示中</span></p>
  </header>

  <aside class="side">
    <section class="panel" aria-labelledby="in-h">
      <h2 id="in-h">経験職種 <small id="cnt">0/10</small></h2>
      <p class="hint">職種名を入力して候補から選び、経験年数を選びます。最大10職種です。</p>
      <div class="rows" id="rows"></div>
      <div class="btns">
        <button class="btn primary" id="add" type="button">職種を追加</button>
        <button class="btn" id="clear" type="button">全部消す</button>
      </div>
      <hr class="sep">
      <div class="hint">入力例</div>
      <div class="btns">
        <button class="btn" data-preset="0" type="button">営業 + DX</button>
        <button class="btn" data-preset="1" type="button">コールセンター</button>
        <button class="btn" data-preset="2" type="button">事務 + 経理</button>
      </div>
      <hr class="sep">
      <div class="field">
        <label for="target">気になる職種を直接調べる</label>
        <input id="target" list="jobs" placeholder="例: DXコンサルタント" autocomplete="off">
      </div>
      <p class="side-note">スキルは職種と経験年数からの推定です。実際の習熟度は担当した仕事の内容や頻度で変わります。</p>
    </section>
  </aside>

  <main class="main" id="out" aria-live="polite"></main>
</div>
<datalist id="jobs"></datalist>

const YEARS=["1年未満","1〜3年","3〜5年","5〜10年","10年以上"];
const YF=[0.4,0.7,0.9,1.1,1.3];
const MAXJOBS=10;
const TH=[0.7,0.45,0.25];

const SKILLS={},TASKS={},SUBS=[],JOBS=new Map(),SUBBYNAME={};
SK.split("\n").forEach(l=>{const [id,name,def]=l.split("|");SKILLS[id]={id,name,def,cat:null};});
TK.split("\n").forEach(l=>{
  const [id,name,acts]=l.split("|");
  const cat=Math.floor((parseInt(id.slice(1),10)-1)/5);
  const actions=acts.split(";").map(a=>{const [text,skill]=a.split(":");return {text,skill};});
  TASKS[id]={id,name,cat,actions};
  actions.forEach(a=>{if(SKILLS[a.skill].cat===null)SKILLS[a.skill].cat=cat;});
});
function addJob(name,subIdx){
  let j=JOBS.get(name);
  if(!j){j={name,subs:new Set(),group:"",cat:SUBS[subIdx].cat};JOBS.set(name,j);}
  j.subs.add(subIdx);
}
SB.split("\n").forEach((l,i)=>{
  const [cat,name,tasks,jobs]=l.split("|");
  SUBS.push({id:i,cat:+cat,name,tasks:tasks.split(","),jobs:jobs.split("、")});
  SUBBYNAME[name]=i;
});
SUBS.forEach(s=>s.jobs.forEach(n=>addJob(n,s.id)));
EX.split("\n").forEach(l=>{const [n,subs]=l.split("|");subs.split(",").forEach(sn=>addJob(n,SUBBYNAME[sn]));});
GR.split("\n").forEach(l=>{const [g,names]=l.split("|");names.split(",").forEach(n=>{const j=JOBS.get(n);if(j)j.group=g;});});
const JOBNAMES=[...JOBS.keys()];

const reqCache=new Map();
function reqOf(name){
  if(reqCache.has(name))return reqCache.get(name);
  const j=JOBS.get(name),m=new Map();
  j.subs.forEach(si=>{
    const sb=SUBS[si],seen=new Set();
    sb.tasks.forEach(tid=>{
      const t=TASKS[tid];
      t.actions.forEach(a=>{
        let e=m.get(a.skill);
        if(!e){e={w:0,paths:[]};m.set(a.skill,e);}
        if(!seen.has(a.skill)){seen.add(a.skill);e.w++;}
        e.paths.push({sub:sb.name,task:t.name,action:a.text});
      });
    });
  });
  reqCache.set(name,m);
  return m;
}
function sigOf(name){return [...JOBS.get(name).subs].sort((a,b)=>a-b).join(",");}
function lvl(r){return r<0.5?1:r<0.9?2:r<1.4?3:r<2.0?4:5;}
function have(r){return Math.min(1,(r||0)/0.9);}

function analyze(entries){
  const uniq=new Map();
  entries.forEach(e=>{if(JOBS.has(e.job)){const o=uniq.get(e.job);if(!o||e.y>o.y)uniq.set(e.job,{job:e.job,y:e.y});}});
  const raw=new Map(),ev=new Map(),byJob=new Map();
  uniq.forEach(e=>{
    const req=reqOf(e.job);
    byJob.set(e.job,{y:e.y,req});
    req.forEach((v,s)=>{
      const c=YF[e.y]*(1+0.25*Math.min(2,v.w-1));
      raw.set(s,(raw.get(s)||0)+c);
      if(!ev.has(s))ev.set(s,[]);
      v.paths.slice(0,3).forEach(p=>ev.get(s).push({job:e.job,y:e.y,sub:p.sub,task:p.task,action:p.action}));
    });
  });
  const list=[...raw.entries()].map(([id,r])=>({id,raw:r,lv:lvl(r)})).sort((a,b)=>b.raw-a.raw);
  return {list,raw,ev,byJob,jobs:[...uniq.keys()]};
}
function evalJob(an,name){
  const req=reqOf(name),j=JOBS.get(name);
  let tw=0,hw=0;
  const gaps=[],strengths=[];
  req.forEach((v,s)=>{
    tw+=v.w;
    const h=have(an.raw.get(s));
    hw+=v.w*h;
    if(h<0.6)gaps.push({id:s,w:v.w,path:v.paths[0],h});
    else strengths.push({id:s,w:v.w,h});
  });
  gaps.sort((a,b)=>b.w-a.w||a.h-b.h);
  strengths.sort((a,b)=>b.w-a.w);
  const from=[];
  an.byJob.forEach((o,jn)=>{
    let n=0;req.forEach((v,s)=>{if(o.req.has(s))n++;});
    if(n>0)from.push({job:jn,n});
  });
  from.sort((a,b)=>b.n-a.n);
  const strong=from.filter(f=>f.n>=2).slice(0,3);
  return {name,cat:j.cat,group:j.group,cov:tw?hw/tw:0,gaps,strengths,from:(strong.length?strong:from.slice(0,1))};
}
function recommend(an,catFilter){
  const owned=new Set(an.jobs),groups=new Map();
  JOBNAMES.forEach(n=>{const s=sigOf(n);if(!groups.has(s))groups.set(s,[]);groups.get(s).push(n);});
  const tiers=[[],[],[]],lateral=[];
  groups.forEach(names=>{
    const free=names.filter(n=>!owned.has(n));
    if(!free.length)return;
    const it=evalJob(an,free[0]);
    it.same=free.slice(1);
    if(it.gaps.length===0){free.forEach(n=>lateral.push(n));return;}
    if(catFilter>=0&&it.cat!==catFilter)return;
    if(it.cov>=TH[0])tiers[0].push(it);
    else if(it.cov>=TH[1])tiers[1].push(it);
    else if(it.cov>=TH[2])tiers[2].push(it);
  });
  tiers.forEach(t=>t.sort((a,b)=>b.cov-a.cov||b.gaps.length-a.gaps.length));
  return {tiers,lateral};
}

  return `<div class="row" data-i="${i}">
    <input class="job" id="job${i}" list="jobs" value="${esc(r.job)}" placeholder="職種を入力" aria-label="経験職種 ${i+1}" autocomplete="off">
    <select id="yr${i}" aria-label="経験年数 ${i+1}">${opts}</select>
    <button class="del" type="button" aria-label="この職種を消す">×</button>
    <div class="meta"></div></div>`;
}
function buildRows(){
  $("#rows").innerHTML=state.rows.map(rowHtml).join("");
  $("#add").disabled=state.rows.length>=MAXJOBS;
  $("#cnt").textContent=state.rows.length+"/"+MAXJOBS;
  refreshMeta();
}
function refreshMeta(){
  document.querySelectorAll("#rows .row").forEach(el=>{
    const r=state.rows[+el.dataset.i],m=el.querySelector(".meta"),j=JOBS.get(r.job);
    if(j){
      const subs=[...j.subs].slice(0,4).map(si=>SUBS[si].name).join("・");
      m.style.setProperty("--dc","var(--c"+j.cat+")");
      m.innerHTML=`<span class="dot"></span><span>${esc(CATS[j.cat])} ／ ${esc(subs)}</span>`;
    }else{
      m.style.removeProperty("--dc");
      m.textContent=r.job?"候補にない職種名です。近い職種を候補から選んでください。":"";
    }
  });
}
function lvDots(n){let h="";for(let i=1;i<=5;i++)h+=`<i class="${i<=n?"on":""}"></i>`;return `<span class="lv" aria-hidden="true">${h}</span>`;}

function skillsHtml(an){
  const byCat=[...Array(8)].map(()=>[]);
  an.list.forEach(s=>byCat[SKILLS[s.id].cat].push(s));
  const groups=byCat.map((arr,c)=>arr.length?`<div class="cat" style="--cc:var(--c${c})"><h3>${CATS[c]}</h3><div class="chips">${
    arr.map(s=>`<button type="button" class="sk" data-sk="${s.id}" aria-pressed="${state.sel===s.id}">${esc(SKILLS[s.id].name)}${lvDots(s.lv)}</button>`).join("")
  }</div></div>`:"").join("");
  return `<section class="panel" aria-labelledby="sk-h">
    <h2 id="sk-h">抽出されたスキル <small>${an.list.length}個 ／ 経験職種 ${an.jobs.length}</small></h2>
    <p class="hint">色は職務の系統、棒の数は経験の厚み（職種と年数からの推定）です。スキルを押すと根拠が見られます。</p>
    ${groups}
    <div class="ev" id="ev">${evHtml(an)}</div></section>`;
}
function evHtml(an){
  const id=state.sel&&an.raw.has(state.sel)?state.sel:(an.list[0]&&an.list[0].id);
  if(!id)return "";
  state.sel=id;
  const sk=SKILLS[id],lv=lvl(an.raw.get(id));
  const seen=new Set();
  const rows=(an.ev.get(id)||[]).filter(e=>{const k=e.job+e.task+e.action;if(seen.has(k))return false;seen.add(k);return true;}).slice(0,6)
    .map(e=>`<li><b>${esc(e.job)}</b><span>${YEARS[e.y]}</span><span>${esc(e.task)} → ${esc(e.action)}</span></li>`).join("");
  return `<h3>${esc(sk.name)} <span class="badge">Lv${lv}</span></h3><p>${esc(sk.def)}</p><ul>${rows}</ul>`;
}
function cardHtml(it){
  const stations=it.from.map(f=>`<li class="st"><span class="p"></span>${esc(f.job)}</li>`).join("");
  const gaps=it.gaps.slice(0,5).map(g=>`<li><b>${esc(SKILLS[g.id].name)}</b><span>${esc(g.path.task)}：${esc(g.path.action)}</span></li>`).join("");
  const rest=it.gaps.length>5?`<p class="more">ほか${it.gaps.length-5}個</p>`:"";
  const st=it.strengths.slice(0,8).map(s=>`<span>${esc(SKILLS[s.id].name)}</span>`).join("");
  const pct=Math.round(it.cov*100);
  const same=it.same&&it.same.length?`<p class="grp">同じスキル構成：${esc(it.same.slice(0,6).join("、"))}${it.same.length>6?" ほか":""}</p>`:"";
  return `<article class="path" style="--lc:var(--c${it.cat})">
    <header><div><h4>${esc(it.name)}</h4><p class="grp">${esc(CATS[it.cat])}${it.group?" ／ "+esc(it.group):""}</p></div>
    <div class="pct">${pct}<small>%</small></div></header>
    <ol class="route" aria-label="経験から目標への道">${stations}<li class="st goal"><span class="p"></span><b>${esc(it.name)}</b></li></ol>
    <div class="meter" role="img" aria-label="現在のスキルでの到達度 ${pct}%"><span style="width:${pct}%"></span></div>
    <div class="two">
      <div class="blk"><h5>活かせるスキル ${it.strengths.length}個</h5><div class="mini">${st||'<span>なし</span>'}</div></div>
      <div class="blk"><h5>身につけたいスキル ${it.gaps.length}個</h5><ul class="gaps">${gaps}</ul>${rest}</div>
    </div>${same}</article>`;
}
function pathsHtml(an,rec){
  const tn=["すぐ狙える","あと一歩","中長期で目指す"],td=["今のスキルで半分以上をカバーできます","不足スキルを補えば届きます","複数のスキルを新しく積む必要があります"];
  const filters=`<div class="filters" role="group" aria-label="目標職種の系統">`+
    [`<button type="button" class="f" data-f="-1" aria-pressed="${state.filter===-1}">すべて</button>`].concat(
    CATS.map((c,i)=>`<button type="button" class="f" data-f="${i}" aria-pressed="${state.filter===i}">${c}</button>`)).join("")+`</div>`;
  let direct="";
  if(state.target&&JOBS.has(state.target)){
    const it=evalJob(an,state.target);
    direct=`<div class="tier"><h3>指定した職種 <small>${esc(state.target)}までの距離</small></h3><div class="cards">${cardHtml(it)}</div></div>`;
  }else if(state.target){
    direct=`<p class="empty">「${esc(state.target)}」は職種マスタにありません。候補から選んでください。</p>`;
  }
  const tiers=rec.tiers.map((arr,k)=>{
    if(!arr.length)return "";
    const lim=state.open[k]?arr.length:4;
    const shown=arr.slice(0,lim).map(cardHtml).join("");
    const btn=arr.length>4?`<button type="button" class="btn" data-more="${k}">${state.open[k]?"閉じる":"残り"+(arr.length-4)+"件を見る"}</button>`:"";
    return `<div class="tier"><h3>${tn[k]} <small>${td[k]}（${arr.length}件）</small></h3><div class="cards">${shown}</div>${btn}</div>`;
  }).join("");
  const none=!tiers&&!direct?`<p class="empty">この系統で届きそうな職種はまだ見つかりません。系統を「すべて」に戻すか、経験職種を追加してください。</p>`:"";
  const lat=rec.lateral.length?`<p class="lateral"><b>今のスキルのまま移れそうな職種：</b>${esc(rec.lateral.slice(0,12).join("、"))}${rec.lateral.length>12?" ほか":""}</p>`:"";
  return `<section class="panel" aria-labelledby="pt-h"><h2 id="pt-h">スキルから見たキャリアの道</h2>
    <p class="hint">到達度は、目標職種が求めるスキルのうち、今の経験でカバーできている割合です。</p>
    ${filters}${direct}${tiers}${none}${lat}</section>`;
}
function render(){
  const an=analyze(state.rows.map(r=>({job:r.job,y:r.y})));
  $("#exbadge").hidden=!state.example;
  if(!an.jobs.length){
    $("#out").innerHTML=`<div class="empty">左の欄に経験した職種を入力すると、身についたスキルとキャリアの道が表示されます。</div>`;
    return;
  }
  $("#out").innerHTML=skillsHtml(an)+pathsHtml(an,recommend(an,state.filter));
}
function update(){refreshMeta();save();render();}

document.addEventListener("DOMContentLoaded",()=>{});
(function init(){
  $("#jobs").innerHTML=JOBNAMES.map(n=>`<option value="${esc(n)}"></option>`).join("");
  load();
  $("#target").value=state.target;
  buildRows();
  render();

  $("#rows").addEventListener("input",e=>{
    const row=e.target.closest(".row");if(!row)return;
    const r=state.rows[+row.dataset.i];
    if(e.target.matches("input.job"))r.job=e.target.value.trim();
    if(e.target.matches("select"))r.y=+e.target.value;
    state.example=false;update();
  });
  $("#rows").addEventListener("click",e=>{
    if(!e.target.matches(".del"))return;
    const i=+e.target.closest(".row").dataset.i;
    state.rows.splice(i,1);state.example=false;buildRows();update();
  });
  $("#add").addEventListener("click",()=>{
    if(state.rows.length>=MAXJOBS)return;
    state.rows.push({job:"",y:1});buildRows();
    const el=$("#job"+(state.rows.length-1));if(el)el.focus();
  });
  $("#clear").addEventListener("click",()=>{state.rows=[{job:"",y:1}];state.example=false;state.sel=null;buildRows();update();});
  document.querySelectorAll("[data-preset]").forEach(b=>b.addEventListener("click",()=>{setPreset(+b.dataset.preset);buildRows();update();}));
  $("#target").addEventListener("input",e=>{state.target=e.target.value.trim();save();render();});
  $("#out").addEventListener("click",e=>{
    const sk=e.target.closest("[data-sk]");
    if(sk){state.sel=sk.dataset.sk;render();return;}
    const f=e.target.closest("[data-f]");
    if(f){state.filter=+f.dataset.f;save();render();return;}
    const m=e.target.closest("[data-more]");
    if(m){state.open[m.dataset.more]=!state.open[m.dataset.more];render();}
  });
})();
</script>
</body>
</html>
